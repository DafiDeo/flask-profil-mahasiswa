<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Profil Mahasiswa{% endblock %} — Dafi Deo Ananda Nurrokhim</title>

  <!-- 1. Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- 2. CSS milik project (SETELAH Bootstrap agar bisa menimpa style) -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block styles %}{% endblock %}
</head>
<body>

  <!-- NAVBAR (partial terpisah, memuat menu aktif dinamis) -->
  {% include "partials/navbar.html" %}

  <!-- KONTEN TIAP HALAMAN (diisi child template) -->
  {% block content %}{% endblock %}

  <!-- FOOTER (sama di semua halaman, karena ada di base) -->
  <footer class="text-center py-4 mt-4">
    <p class="mb-1">© 2026 — Dibuat dengan <i class="bi bi-bootstrap-fill" style="color:#7952b3;"></i> Bootstrap & Flask</p>
    <small>Ikuti saya :
      <a href="https://www.instagram.com/_dafideoyy_"><i class="bi bi-instagram ms-1"></i></a>
      <a href="https://github.com/DafiDeo"><i class="bi bi-github ms-2"></i></a>
    </small>
  </footer>

  <!-- MODAL KONTAK (sama di semua halaman) -->
  <div class="modal fade" id="modalKontak" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-envelope-paper me-2"></i>Hubungi Saya</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formKontak" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold">Nama</label>
              <input type="text" id="kontakNama" class="form-control" placeholder="masukkan nama">
              <div class="invalid-feedback">Nama wajib diisi.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" id="kontakEmail" class="form-control" placeholder="name@example.com">
              <div class="invalid-feedback">Email harus mengandung @ dan .</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Pesan</label>
              <textarea id="kontakPesan" class="form-control" rows="3" placeholder="tulis pesan..."></textarea>
              <div class="invalid-feedback">Pesan minimal 10 karakter.</div>
            </div>
            <div id="infoKontak" class="alert py-2 d-none"></div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
              <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Kirim</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery (WAJIB sebelum script.js, agar tidak error "$ is not defined") -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Script milik project (dari folder static, dipanggil dengan url_for) -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
